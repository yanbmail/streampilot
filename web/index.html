<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreamPilot 流控台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c8dff'/%3E%3Cpath d='M11 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-logo">
    <svg viewBox="0 0 48 48" width="44" height="44"><rect width="48" height="48" rx="12" fill="#4c8dff"/><path d="M17 13l17 11-17 11z" fill="#fff"/></svg>
  </div>
  <div class="boot-text">StreamPilot 正在启动</div>
  <div class="boot-bar"><i></i></div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 48 48" width="30" height="30"><rect width="48" height="48" rx="12" fill="url(#bg)"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b9bff"/><stop offset="1" stop-color="#2b62d9"/></linearGradient></defs><path d="M17 13l17 11-17 11z" fill="#fff"/></svg>
      <div class="brand-text"><b>StreamPilot</b><span>流控台</span></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-page="dashboard"><i data-icon="grid"></i><span>总览</span></a>
      <a href="#/streams" data-page="streams"><i data-icon="cast"></i><span>推流任务</span><em id="nav-running"></em></a>
      <a href="#/schedule" data-page="schedule"><i data-icon="clock"></i><span>排播表</span><em id="nav-schedule"></em></a>
      <a href="#/templates" data-page="templates"><i data-icon="save"></i><span>推流模板</span></a>
      <a href="#/sources" data-page="sources"><i data-icon="tv"></i><span>电视源</span><em id="nav-channels"></em></a>
      <a href="#/player" data-page="player"><i data-icon="play"></i><span>播放器</span></a>
      <a href="#/logs" data-page="logs"><i data-icon="terminal"></i><span>运行日志</span></a>
      <a href="#/settings" data-page="settings"><i data-icon="sliders"></i><span>设置与备份</span></a>
      <a href="#/help" data-page="help"><i data-icon="help"></i><span>使用说明</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="sys-pill" id="sys-pill"><i class="dot"></i><span>检测环境…</span></div>
      <div class="ver">v1.2.3</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-head">
        <h1 id="page-title">总览</h1>
        <p id="page-sub">全局推流状态与实时指标</p>
      </div>
      <div class="top-actions" id="top-actions"></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="/vendor/hls.min.js"></script>
<script src="/vendor/mpegts.js"></script>
<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/job-form.js"></script>
<script src="/js/views.js"></script>
<script src="/js/schedule.js"></script>
<script src="/js/templates.js"></script>
<script src="/js/tv.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
